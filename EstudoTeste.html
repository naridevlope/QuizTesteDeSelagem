<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de selagem</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .question-block h3 {
            margin-top: 0;
            color: #333;
        }
        /* Textarea de RESPOSTA DO USUÁRIO */
        .question-block .user-answer-textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; 
            min-height: 80px;
        }
        .resposta-correta {
            margin-top: 10px;
            padding: 10px;
            border-left: 5px solid #4CAF50;
            background-color: #e8f5e9;
            color: #388e3c;
            font-style: italic;
            display: none; /* Escondido por padrão */
        }
        /* Texto do gabarito (para ser editável) */
        .gabarito-texto {
            font-style: normal;
            color: #333;
        }

        /* --- ESTILOS DE EDIÇÃO --- */
        .area-edicao {
            display: none; /* Escondido por padrão */
            border-top: 1px dashed #ccc;
            margin-top: 15px;
            padding-top: 15px;
        }
        .area-edicao label {
            display: block;
            font-weight: bold;
            margin-top: 10px;
        }
        .area-edicao textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            min-height: 80px;
        }
        /* --- ESTILOS DOS BOTÕES --- */
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            
        }
        button:hover {
            background-color: #e0a800;
            color: #333;
        }
        /* Botão de editar */
        .btn-editar {
            background:#007bff; /* Azul */
            color: #fff;
            padding: 8px 12px;
            font-size: 14px;
            margin-top: 10px;
            margin-right: 10px;
        }
        .btn-editar:hover {
            background: #e0a800;
            color: #333;
        }
        /* Botão de salvar */
        .btn-salvar {
            background: #28a745; /* Verde */
            padding: 10px 15px;
            font-size: 14px;
            margin-top: 10px;
        }
        .btn-salvar:hover {
            background: #218838;
            color: #fff;
        }
        /* --- NOVO: Botão Excluir --- */
        .btn-excluir {
            background: #dc3545; /* Vermelho */
            color: #fff;
            padding: 8px 12px;
            font-size: 14px;
            margin-top: 10px;
        }
        .btn-excluir:hover {
            background: #c82333;
            color: #fff;
        }

        /* --- NOVO BOTÃO ADICIONAR --- */
        .btn-add {
            background-color: #17a2b8; /* Ciano */
            width: 100%;
            margin-bottom: 25px; /* Espaço antes da primeira pergunta */
            margin-top: 10px;
        }
        .btn-add:hover {
            background-color: #138496;
            color: #fff;
        }

        body {
            background-image: url(images/photo_2025-10-26_11-42-02.jpg);
            background-size:cover;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Teste de selagem</h1>
    <p>Digite suas respostas e clique em "Ver Respostas" para comparar com o gabarito.</p>

    <button type="button" id="btn-add-question" class="btn-add">Adicionar Nova Pergunta</button>

    <form id="quizForm">
        
        <button type="button" onclick="toggleAnswers()">Ver / Ocultar Respostas</button>
    </form>
</div>

<script>
    // Chave para salvar no localStorage
    const STORAGE_KEY = 'meuQuizPerguntas';

    // Função original para mostrar/ocultar gabarito (sem alterações)
    function toggleAnswers() {
        const answers = document.querySelectorAll('.resposta-correta');
        const mainButton = document.querySelector('button[onclick="toggleAnswers()"]');
        let isShowing = false;
        answers.forEach(answer => {
            if (answer.style.display === 'block') {
                answer.style.display = 'none';
            } else {
                answer.style.display = 'block';
                isShowing = true;
            }
        });
        if (isShowing) {
            mainButton.textContent = 'Ocultar Respostas';
        } else {
            mainButton.textContent = 'Ver / Ocultar Respostas';
        }
    }

    /**
     * Lê todo o DOM e salva no localStorage.
     */
    function salvarPerguntasNoLocalStorage() {
        const todasPerguntas = [];
        const questionBlocks = document.querySelectorAll('#quizForm .question-block');
        
        questionBlocks.forEach(block => {
            const h3Pergunta = block.querySelector('h3');
            const spanGabarito = block.querySelector('.gabarito-texto');
            
            if (h3Pergunta && spanGabarito) {
                todasPerguntas.push({
                    pergunta: h3Pergunta.textContent,
                    gabarito: spanGabarito.textContent
                });
            }
        });
        
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todasPerguntas));
    }

    /**
     * MODIFICADO: Cria o HTML para um bloco de pergunta (agora com botão Excluir).
     */
    function criarBlocoPergunta(perguntaTxt, gabaritoTxt, numero) {
        const newQuestionBlock = document.createElement('div');
        newQuestionBlock.className = 'question-block';
        newQuestionBlock.dataset.questionId = numero;

        newQuestionBlock.innerHTML = `
            <div class="area-visualizacao">
                <h3>${perguntaTxt}</h3>
                <div class="resposta-correta" id="a${numero}">
                    Gabarito: <span class="gabarito-texto">${gabaritoTxt}</span>
                </div>
                <button type="button" class="btn-editar">Editar</button>
                <button type="button" class="btn-excluir">Excluir</button>
            </div>
            <div class="area-edicao">
                <label>Editar Pergunta:</label>
                <textarea class="editar-pergunta-txt"></textarea>
                <label>Editar Gabarito:</label>
                <textarea class="editar-gabarito-txt"></textarea>
                <button type="button" class="btn-salvar">Salvar</button>
            </div>
            <textarea id="q${numero}" name="q${numero}" class="user-answer-textarea" placeholder="Sua Resposta..."></textarea>
        `;
        return newQuestionBlock;
    }

    /**
     * Carrega as perguntas do localStorage e as renderiza na página.
     */
    function carregarPerguntasSalvas() {
        const quizForm = document.getElementById('quizForm');
        const toggleButton = quizForm.querySelector('button[onclick="toggleAnswers()"]');
        
        const perguntasSalvasJSON = localStorage.getItem(STORAGE_KEY);
        
        if (perguntasSalvasJSON) {
            const perguntasSalvas = JSON.parse(perguntasSalvasJSON);
            
            // Limpa o formulário
            const blocosExistentes = quizForm.querySelectorAll('.question-block');
            blocosExistentes.forEach(bloco => bloco.remove());
            
            // Renderiza as perguntas salvas
            perguntasSalvas.forEach((pergunta, index) => {
                const numero = index + 1;
                const novoBloco = criarBlocoPergunta(pergunta.pergunta, pergunta.gabarito, numero);
                quizForm.insertBefore(novoBloco, toggleButton);
            });
            
        } else {
            // Página começa vazia se não houver nada salvo
        }
    }

    /**
     * Garante que os números das perguntas (1., 2., 3.)
     * estejam sempre corretos.
     */
    function renumerarPerguntas() {
        const questionBlocks = document.querySelectorAll('#quizForm .question-block');
        questionBlocks.forEach((block, index) => {
            const numero = index + 1;
            const h3Pergunta = block.querySelector('h3');
            
            if (h3Pergunta) {
                let textoAtual = h3Pergunta.textContent;
                // Remove o número antigo (ex: "3. ") e coloca o novo (ex: "2. ")
                textoAtual = textoAtual.replace(/^[0-9]+\. /, ''); 
                h3Pergunta.textContent = `${numero}. ${textoAtual}`;
            }
            
            // Atualiza também os IDs e 'name' para consistência
            block.dataset.questionId = numero;
            const respostaCorreta = block.querySelector('.resposta-correta');
            if (respostaCorreta) respostaCorreta.id = `a${numero}`;
            
            const textareaResposta = block.querySelector('.user-answer-textarea');
            if (textareaResposta) {
                textareaResposta.id = `q${numero}`;
                textareaResposta.name = `q${numero}`;
            }
        });
    }

    // --- LÓGICA PRINCIPAL (QUANDO A PÁGINA CARREGA) ---
    document.addEventListener('DOMContentLoaded', function() {
        
        const quizForm = document.getElementById('quizForm');
        const btnAddQuestion = document.getElementById('btn-add-question');
        const toggleButton = quizForm.querySelector('button[onclick="toggleAnswers()"]');

        // 1. Carrega as perguntas salvas (se existirem)
        carregarPerguntasSalvas();

        // 2. Lógica para ADICIONAR NOVA PERGUNTA
        btnAddQuestion.addEventListener('click', function() {
            const currentQuestionCount = document.querySelectorAll('#quizForm .question-block').length;
            const newQuestionNumber = currentQuestionCount + 1;
            
            const perguntaTxt = `${newQuestionNumber}. Nova Pergunta...`;
            const gabaritoTxt = 'Novo Gabarito...';

            const novoBloco = criarBlocoPergunta(perguntaTxt, gabaritoTxt, newQuestionNumber);
            quizForm.insertBefore(novoBloco, toggleButton);
            
            // Salva o novo estado no localStorage
            salvarPerguntasNoLocalStorage();
        });


        // 3. Lógica de EVENTOS (EDITAR/SALVAR/EXCLUIR) usando Delegação
        document.addEventListener('click', function(event) {
            
            const target = event.target; // O elemento exato que foi clicado

            // --- Lógica se o clique foi no Botão de EDITAR ---
            if (target.classList.contains('btn-editar')) {
                const container = target.closest('.question-block');
                if (!container) return; 

                const displayArea = container.querySelector('.area-visualizacao');
                const editArea = container.querySelector('.area-edicao');
                const h3Pergunta = container.querySelector('h3');
                const spanGabarito = container.querySelector('.gabarito-texto');
                const textareaPergunta = container.querySelector('.editar-pergunta-txt');
                const textareaGabarito = container.querySelector('.editar-gabarito-txt');

                textareaPergunta.value = h3Pergunta.textContent;
                textareaGabarito.value = spanGabarito.textContent;

                displayArea.style.display = 'none';
                editArea.style.display = 'block';
            }

            // --- Lógica se o clique foi no Botão de SALVAR ---
            if (target.classList.contains('btn-salvar')) {
                const container = target.closest('.question-block');
                if (!container) return;

                const displayArea = container.querySelector('.area-visualizacao');
                const editArea = container.querySelector('.area-edicao');
                const h3Pergunta = container.querySelector('h3');
                const spanGabarito = container.querySelector('.gabarito-texto');
                const textareaPergunta = container.querySelector('.editar-pergunta-txt');
                const textareaGabarito = container.querySelector('.editar-gabarito-txt');

                h3Pergunta.textContent = textareaPergunta.value;
                spanGabarito.textContent = textareaGabarito.value;

                editArea.style.display = 'none';
                displayArea.style.display = 'block';
                
                // Renumera e salva no localStorage
                renumerarPerguntas();
                salvarPerguntasNoLocalStorage();
            }

            // --- NOVO: Lógica se o clique foi no Botão de EXCLUIR ---
            if (target.classList.contains('btn-excluir')) {
                // Pede confirmação
                if (confirm('Tem certeza que deseja excluir esta pergunta?')) {
                    const container = target.closest('.question-block');
                    if (!container) return;

                    // 1. Remove o bloco da página
                    container.remove();
                    
                    // 2. Renumera as perguntas restantes
                    renumerarPerguntas();
                    
                    // 3. Salva a nova lista (sem a pergunta excluída) no localStorage
                    salvarPerguntasNoLocalStorage();
                }
            }
        });
        
    });
</script>

</body>
</html>
